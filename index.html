<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado LU4 Carmine | Personajes</title>
    
    <link rel="icon" type="image/png" href="image/logo.png">

    <meta property="og:title" content="Mercado LU4 Carmine | Personajes">
    <meta property="og:description" content="Mercado de personajes del servidor LU4 Carmine. Adquiere tu héroe, farmea y domina el servidor.">
    <meta property="og:image" content="https://pablopalma.github.io/carmine-market/Screenshot_228.png"> 
    <meta property="og:url" content="https://pablopalma.github.io/carmine-market/">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- TEMA LINEAGE 2: OSCURO Y DORADO --- */
        :root {
            --bg-dark: #0a0a0d;
            --bg-panel: #16161c;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #997a00;
            --text-light: #e0e0e0;
            --text-muted: #a0a0a0;
            --discord: #5865F2;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at top, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at bottom, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Cinzel Decorative', serif;
            color: var(--gold-primary);
            text-align: center;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            background: linear-gradient(to bottom, #000000, rgba(10, 10, 13, 0.9));
            border-bottom: 1px solid var(--gold-dark);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* --- CONTENEDOR DEL LOGO Y TÍTULO --- */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-logo {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .server-logo:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        .header-title {
            font-size: 2rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .lang-toggle {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .lang-toggle:hover {
            background: var(--gold-primary);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* Botón de solicitar PJ en el header */
        .btn-request {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: transparent;
            color: var(--gold-light);
            border: 1px solid var(--gold-light);
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-request:hover {
            background-color: var(--gold-light);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(243, 229, 171, 0.4);
        }

        /* --- PORTADA (HERO SECTION) --- */
        .hero {
            position: relative;
            width: 100%;
            height: 50vh; 
            min-height: 400px;
            background-image: url('Screenshot_228.png');
            background-size: cover;
            background-position: center 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 80px; 
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(10, 10, 13, 0.3) 0%, rgba(10, 10, 13, 0.8) 70%, var(--bg-dark) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 20px;
        }

        .hero-title {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 3px 3px 10px #000;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--gold-light);
            text-shadow: 2px 2px 5px #000;
            font-style: italic;
            margin: 0;
        }

        /* --- CONTENEDOR Y CARDS --- */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
        }

        .card {
            background-color: var(--bg-panel);
            border: 1px solid #2a2a35;
            border-radius: 10px;
            padding: 30px 25px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--gold-dark);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
        }

        .card-title {
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
            padding-bottom: 5px;
        }

        .stat-label {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .stat-value {
            color: var(--text-light);
            font-weight: 700;
        }

        .desc-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid var(--gold-dark);
            font-size: 0.9rem;
            font-style: italic;
            line-height: 1.5;
            margin: 20px 0;
            color: var(--text-muted);
            min-height: 70px;
        }

        .price-box {
            text-align: center;
            font-size: 1.8rem;
            color: var(--gold-light);
            font-family: 'Cinzel Decorative', serif;
            font-weight: bold;
            margin: 25px 0;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        /* --- BOTÓN DISCORD DE LA CARD --- */
        .btn-discord {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            background-color: var(--discord);
            color: white;
            padding: 15px 0;
            text-decoration: none;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            border: 1px solid transparent;
        }

        .btn-discord:hover {
            background-color: #4752C4;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.4);
        }

        .loading {
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.5rem;
            color: var(--gold-primary);
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                justify-content: center;
            }
            .brand-container {
                justify-content: center;
            }
            .header-actions {
                width: 100%;
                justify-content: center;
            }
            .hero {
                margin-top: 130px;
                height: 40vh;
            }
            .hero-title {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="brand-container">
                <img src="image/logo.png" alt="Logo LU4" class="server-logo">
                <h1 class="header-title" id="main-title">Mercado LU4</h1>
            </div>
            <div class="header-actions">
                <a href="https://discord.com/users/314600554187980800" target="_blank" class="btn-request" id="btn-request">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="request-text">Solicitar PJ</span>
                </a>
                <button class="lang-toggle" onclick="toggleLanguage()" id="lang-btn">EN / ES</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2 class="hero-title" id="hero-title">Mercado de Personajes</h2>
            <p class="hero-subtitle" id="hero-subtitle">Adquiere tu héroe y domina el servidor</p>
        </div>
    </section>

    <main class="container">
        <div class="grid" id="characters-container">
            <div class="loading">Cargando personajes... / Loading characters...</div>
        </div>
    </main>

    <script>
        const discordLink = "https://discord.com/users/314600554187980800"; 
        
        let characters = [];
        let currentLang = 'es';

        const uiText = {
            es: {
                title: "Mercado LU4",
                heroTitle: "Mercado de Personajes",
                heroSubtitle: "Adquiere tu héroe y domina el servidor",
                race: "Raza",
                level: "Nivel Objetivo",
                currentLevel: "Nivel Actual",
                equipment: "Equipo",
                btnContact: "Comprar",
                btnRequest: "Solicitar PJ"
            },
            en: {
                title: "LU4 Market",
                heroTitle: "Character Marketplace",
                heroSubtitle: "Acquire your hero and dominate the server",
                race: "Race",
                level: "Target Level",
                currentLevel: "Current Level",
                equipment: "Gear",
                btnContact: "Buy",
                btnRequest: "Request Char"
            }
        };

        async function loadData() {
            try {
                const response = await fetch('data.json');
                characters = await response.json();
                renderPage();
            } catch (error) {
                document.getElementById('characters-container').innerHTML = 
                    `<div class="loading" style="color: red;">Error al cargar los datos. Verifica el archivo data.json.</div>`;
                console.error("Error cargando el JSON:", error);
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            renderPage();
        }

        function renderPage() {
            if(characters.length === 0) return;

            document.getElementById('main-title').textContent = uiText[currentLang].title;
            document.getElementById('hero-title').textContent = uiText[currentLang].heroTitle;
            document.getElementById('hero-subtitle').textContent = uiText[currentLang].heroSubtitle;
            document.getElementById('request-text').textContent = uiText[currentLang].btnRequest;
            
            const container = document.getElementById('characters-container');
            container.innerHTML = '';

            characters.forEach(char => {
                const data = char[currentLang];
                const ui = uiText[currentLang];
                
                const eqTextLower = data.equipment.toLowerCase();
                const eqColor = (eqTextLower.includes('desnudo') || eqTextLower.includes('naked')) ? '#ff4c4c' : '#aee2a4';

                const cardHTML = `
                    <div class="card">
                        <h2 class="card-title">${data.class}</h2>
                        
                        <div class="stat-row">
                            <span class="stat-label">${ui.race}</span>
                            <span class="stat-value">${data.race}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">${ui.level}</span>
                            <span class="stat-value">${char.level}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">${ui.currentLevel}</span>
                            <span class="stat-value">${char.currentLevel}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">${ui.equipment}</span>
                            <span class="stat-value" style="color: ${eqColor};">${data.equipment}</span>
                        </div>

                        <div class="desc-box">
                            "${data.desc}"
                        </div>

                        <div class="price-box">
                            ${char.price}
                        </div>

                        <a href="${discordLink}" target="_blank" class="btn-discord">
                            <i class="fa-brands fa-discord"></i> ${ui.btnContact}
                        </a>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        loadData();
    </script>
</body>
</html>
